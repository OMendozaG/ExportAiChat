<!doctype html>
<html lang="en">
<head><title>Legacy browser title - ChatGPT</title></head>
<body>
  <aside><a data-sidebar-item href="/c/legacy-chat"><span>Legacy chat</span></a></aside>
  <header><button aria-label="Share" style="width:80px;height:30px">Share</button></header>
  <main>
    <section data-testid="conversation-turn-1" data-turn="user" data-turn-id="legacy-user">
      <h4 class="sr-only">You said:</h4>
      <div data-message-author-role="user" data-message-id="legacy-question">
        <div class="whitespace-pre-wrap">Legacy question</div>
      </div>
    </section>
    <section data-testid="conversation-turn-2" data-turn="assistant" data-turn-id="legacy-assistant">
      <h4 class="sr-only">ChatGPT said:</h4>
      <div data-message-author-role="assistant" data-message-id="legacy-answer">
        <div class="markdown"><p>Legacy <strong>answer</strong>.</p></div>
        <button>ASSISTANT_TOOLBAR_NOISE</button>
      </div>
    </section>
  </main>
</body>
</html>
